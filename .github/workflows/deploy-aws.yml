name: Deploy hiring to AWS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hiring-production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev --include=optional --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:railway
      - run: python3 -m py_compile scripts/aws/deploy-hiring.py
      - run: python3 -m unittest discover -s tests/aws -p 'test_*.py'
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::286853118669:role/hiring-github-actions-deploy
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - name: Build and push immutable commit image
        env:
          IMAGE: 286853118669.dkr.ecr.us-east-1.amazonaws.com/hiring:${{ github.sha }}
        run: |
          docker build --platform linux/arm64 --label org.opencontainers.image.revision="$GITHUB_SHA" -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Deploy exact commit through restricted SSM document
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          command_id=$(aws ssm send-command --document-name HiringDeploy --instance-ids i-04bbe6b1c7d2d0451 --parameters "CommitSha=$DEPLOY_SHA" --timeout-seconds 1800 --query 'Command.CommandId' --output text)
          for attempt in $(seq 1 480); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id i-04bbe6b1c7d2d0451 --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling) echo "Deployment failed: $status"; exit 1 ;;
            esac
            sleep 4
          done
          echo 'Deployment verification timed out'; exit 1
